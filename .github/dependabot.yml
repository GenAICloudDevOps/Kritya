version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint peers on `typescript >=4.8.4 <6.1.0`, so a TS 7 bump
      # cannot pass lint no matter how it's resolved — the PR is reopened
      # weekly and sits there occupying one of the five slots above. Drop this
      # entry once typescript-eslint widens its peer range to accept TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The other half of the pair. This entry is an npm alias for the real
      # TypeScript 7 compiler, so a major bump swaps the compiler underneath the
      # build. `npm run check:typescript-setup` guards the aliases themselves,
      # but that only fires once a PR exists — ignoring majors here keeps the
      # noisy one from being opened at all. Minor/patch updates still come
      # through. See CONTRIBUTING.md ("Why are there two TypeScript packages?").
      - dependency-name: "@typescript/native"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # github/codeql-action is one dependency spread across several entry
      # points (init, analyze, upload-sarif), and CodeQL refuses to run when
      # those steps disagree: "Loaded a configuration file for version X, but
      # running version Y. All steps in a workflow that use
      # github/codeql-action must use the same version." Ungrouped, Dependabot
      # opens one PR per entry point, so each individual PR is red on arrival
      # and none of them can be merged alone. Grouping forces a single PR that
      # moves every step together.
      codeql-action:
        patterns:
          # Both spellings: the docs only promise that `*` matches "zero or
          # more characters" without saying whether it crosses a `/`, and the
          # action is referenced by subpath (init, analyze, upload-sarif).
          # Matching on both forms makes the group work either way.
          - "github/codeql-action*"
          - "github/codeql-action/*"
