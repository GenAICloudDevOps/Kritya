name: Build Desktop App

on:
  workflow_dispatch:
  # Paused to conserve Actions minutes. Uncomment to re-enable automatic
  # desktop builds on push to main.
  # push:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows only for now — macOS/Linux legs are commented in, ready to
# uncomment once we're ready to ship those installers too. The app code
# itself is cross-platform (Electron); this matrix just controls which
# installers actually get built and costs Actions minutes.
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        # - ubuntu-latest
        # - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run electron:build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kritya-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 1
