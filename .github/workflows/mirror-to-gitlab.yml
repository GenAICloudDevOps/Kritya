# Mirrors every branch and tag from GitHub to the GitLab copy.
#
# Active: this workflow runs on every push and mirrors all branches and
# tags to the GitLab copy. It needs the GITLAB_TOKEN secret (see
# Prerequisites below).
#
# Why this direction: GitLab Free cannot pull from GitHub — pull mirroring is
# Premium/Ultimate — so the copy has to be pushed from here. kritya is a public
# repo, so these minutes are free, unlike the 400/month GitLab would charge to
# do the same work on its own runners.
#
# Prerequisites:
#   1. An empty GitLab project at gitlab.com/tech_venkat/kritya (no README).
#   2. A project access token on it: role Maintainer, scope write_repository.
#   3. That token stored here as the repo secret GITLAB_TOKEN.
#
# Audited by the `workflow-scan` job in ci.yml like every other *.yml
# workflow: pinned actions, no credential persistence, no template
# injection.

name: Mirror to GitLab

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # Dependabot pushes its branches to this repo, so the push trigger fires,
    # but GitHub withholds repo secrets from Dependabot-triggered runs —
    # GITLAB_TOKEN arrives empty and the push dies with exit 128. That is a
    # red check on every Dependabot PR that says nothing about the PR. The
    # mirror catches up on the push to main that the merge produces.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every ref, not just the one that triggered this run.
          fetch-depth: 0
          persist-credentials: false

      - name: Push all branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: gitlab.com/tech_venkat/kritya.git
        run: |
          # actions/checkout creates a local branch only for the ref that
          # triggered this run. Pushing refs/heads/* straight from there mirrors
          # that single branch — and because the push below prunes, it then
          # deletes every other branch already on GitLab, so the copy would hold
          # exactly one branch forever. Fetch origin's heads into a private
          # namespace first, so the push sees all of them.
          #
          # A private namespace rather than refs/remotes/origin/*, because that
          # one also collects origin/HEAD — a symref that would otherwise arrive
          # on GitLab as a branch literally named HEAD.
          git fetch --prune origin \
            "+refs/heads/*:refs/mirror/heads/*" "+refs/tags/*:refs/tags/*"

          # Pushed by URL rather than via `git remote add`, so the token is
          # never written into .git/config on the runner. GitHub masks secret
          # values in logs, so a failing push cannot echo it back either.
          #
          # --prune propagates branch and tag deletions. No forced push on main:
          # GitLab protects main with "Allowed to force push: No" by default, so
          # a rewritten history fails loudly instead of silently rewriting the
          # copy.
          git push --prune "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" \
            "+refs/mirror/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
