name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static analysis of the JS/TS source for security vulnerabilities
  # (injection, unsafe regex, etc). Results land in the repo's Security tab,
  # not in job logs — a green check here means no new alerts, not zero
  # findings ever.
  #
  # Disabled for now via `if: false`: the scan itself runs fine, but the
  # final upload step fails with "Code scanning is not enabled for this
  # repository" — that's a repo Settings > Code security and analysis toggle
  # (and, on a private repo, may require GitHub Advanced Security), not
  # something this workflow can fix. Kept as a real (non-commented) job so it
  # stays valid, versioned YAML — re-enabling is flipping `if: false` to
  # `if: true` (or deleting the line) once code scanning is turned on for the
  # repo, not reconstructing a commented-out block from scratch.
  codeql:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Needed for the analyze step to read workflow-run context on a
      # private repo (GET /repos/.../actions/runs/...) — without it, the
      # scan itself still completes but the job is reported as a
      # "configuration error" when it can't fetch that metadata.
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

  # Dependency checks that ask the registry, not the machine: the answer is the
  # same on every OS and Node version, so running them once per matrix entry
  # bought no extra coverage and made a registry-side hiccup look like five
  # separate failures. Here a failure is one clearly-labelled red job.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          cache: npm

      # npm ci is itself the integrity check: it fails if any tarball doesn't
      # match the hash pinned in package-lock.json.
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run check:install-scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x]
        include:
          - os: windows-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # Kept per-OS rather than moved above: Windows checkouts can differ in
      # line endings, so this isn't purely a repeat of the Linux run.
      - run: npm run format:check
      # Coverage thresholds only need checking once; running c8 on every
      # OS/Node combination would just repeat the same numbers twice.
      # These two conditions are complements — keep them in sync, or a matrix
      # change can silently leave coverage unenforced everywhere.
      - run: npm test
        if: matrix.os != 'ubuntu-latest'
      - run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest'
