name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency checks that ask the registry, not the machine: the answer is the
  # same on every OS and Node version, so running them once per matrix entry
  # bought no extra coverage and made a registry-side hiccup look like five
  # separate failures. Here a failure is one clearly-labelled red job.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          cache: npm

      # npm ci is itself the integrity check: it fails if any tarball doesn't
      # match the hash pinned in package-lock.json.
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run check:install-scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x]
        include:
          - os: windows-latest
            node-version: 22.x
          # macOS runner costs 10x Actions minutes vs Linux — commented out
          # for now to conserve included minutes. Re-enable by uncommenting
          # once macOS coverage is actually needed (e.g. before a desktop
          # build release).
          # - os: macos-latest
          #   node-version: 22.x
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # Kept per-OS rather than moved above: Windows checkouts can differ in
      # line endings, so this isn't purely a repeat of the Linux run.
      - run: npm run format:check
      # Coverage thresholds only need checking once; running c8 on every
      # OS/Node combination would just repeat the same numbers twice.
      # These two conditions are complements — keep them in sync, or a matrix
      # change can silently leave coverage unenforced everywhere.
      - run: npm test
        if: matrix.os != 'ubuntu-latest'
      - run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest'
