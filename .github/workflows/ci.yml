name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static analysis of the JS/TS source for security vulnerabilities
  # (injection, unsafe regex, etc). Results land in the repo's Security tab,
  # not in job logs — a green check here means no new alerts, not zero
  # findings ever.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Needed for the analyze step to read workflow-run context on a
      # private repo (GET /repos/.../actions/runs/...) — without it, the
      # scan itself still completes but the job is reported as a
      # "configuration error" when it can't fetch that metadata.
      actions: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # Dependency checks that ask the registry, not the machine: the answer is the
  # same on every OS and Node version, so running them once per matrix entry
  # bought no extra coverage and made a registry-side hiccup look like five
  # separate failures. Here a failure is one clearly-labelled red job.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      # npm ci is itself the integrity check: it fails if any tarball doesn't
      # match the hash pinned in package-lock.json.
      - run: npm ci
      # `npm audit` behind a reviewed, expiring per-advisory allowlist — npm
      # can only suppress by severity, which would drop the gate for every
      # future high finding too. See scripts/audit-allowlist.json.
      - run: npm run check:audit
      - run: npm audit signatures
      - run: npm run check:install-scripts
      - run: npm run check:typescript-setup
      # Socket catches supply-chain risk npm audit doesn't: malware,
      # obfuscated/typosquatted packages, install-script behavior, etc.,
      # evaluated against this org's Socket security policy. Reviewed,
      # accepted findings (unreachable CVEs, minified-dist false positives)
      # are documented in SECURITY.md and should be marked accepted in that
      # policy, not re-litigated here on every run.
      #
      # Skipped on PRs from forks: GitHub withholds repo secrets from
      # fork-triggered `pull_request` runs, so SOCKET_CLI_API_TOKEN would be
      # empty there — failing the job on a missing token would be a false
      # red, not a real finding.
      #
      # Runs even if an earlier step in this job failed (e.g. npm audit's
      # registry endpoint timing out) — `!cancelled()` skips this only if the
      # job itself was cancelled, so a flaky npm audit doesn't also deny us
      # Socket's independent coverage for the same push.
      - name: Socket security scan
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: npx --yes @socketsecurity/cli ci
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

  # Secret scanning: gitleaks over the full git history. A committed API key
  # lives in history forever even after rotation, so this gates every PR and
  # every push to main. The allowlist in .gitleaks.toml covers only the
  # deliberately fake secrets used by the secret-redaction tests — a real
  # leaked key would never equal those exact values.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a key committed last month is still a leak today.
          fetch-depth: 0
          persist-credentials: false

      # Pinned binary + SHA256 rather than the gitleaks-action: fewer moving
      # parts, and the checksum pins the artifact — a replaced release fails
      # loudly instead of running quietly different code.
      - name: Install gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz
          echo "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - name: Scan for leaked secrets
        run: ./gitleaks detect --config .gitleaks.toml --no-banner --verbose --redact

  # Verifies the artifact users actually download. Every other job here runs
  # against the checkout, so a broken `files` field, a `bin` entry pointing
  # outside the packed set, or a missing runtime asset would ship with every
  # test still green — the repo tree is not what `npm install -g kritya`
  # produces. This packs the tarball, asserts on the manifest, then installs it
  # into a clean directory and runs the CLI from there.
  #
  # All three OSes on purpose: the global-install path is not the same code
  # path on each. Windows gets .cmd/.ps1 shims and macOS a different bin
  # symlink layout, so an entry point that is broken there still passes on
  # Linux — which is exactly the leg that used to run alone. Each leg is cheap
  # (~1 min), and the release depends on this being right.
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      # `npm pack` does not run prepublishOnly, so dist/ has to exist first.
      - run: npm run build
      # Manifest only — cheap, and no second dependency install.
      - run: npm run check:package
      # The real thing: install the packed tarball into a temp dir and run it.
      - run: npm run check:smoke

  test:
    runs-on: ${{ matrix.cell.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The suite (~3.5 min whole) is split into 4 shards running in
        # parallel; each shard runs ~1/4 of the test files. run-tests.mjs
        # assigns files to shards by sorted index, so shards are stable
        # run to run. Bump the list if the suite grows a lot.
        shard: [1, 2, 3, 4]
        cell:
          # Both Node versions the package claims to support (`engines:
          # >=22`): 22.x is the floor, 24.x is the Active LTS most users
          # will actually be on once 22 drops to maintenance. Testing only
          # the floor meant the newer half of that range was never exercised.
          # The ubuntu + 22.x cell additionally records raw coverage, merged
          # and threshold-checked in the `coverage` job below; every cell
          # still runs the full suite across its 4 shards.
          - { os: ubuntu-latest, node: 22.x, coverage: true }
          - { os: ubuntu-latest, node: 24.x, coverage: false }
          - { os: windows-latest, node: 22.x, coverage: false }
          - { os: macos-latest, node: 22.x, coverage: false }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.cell.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      # Lint/format run once per cell (shard 1) rather than per shard: still
      # per-OS, since Windows checkouts can differ in line endings.
      - run: npm run lint
        if: matrix.shard == 1
      # Kept per-OS rather than moved above: Windows checkouts can differ in
      # line endings, so this isn't purely a repeat of the Linux run.
      - run: npm run format:check
        if: matrix.shard == 1

      # Coverage cells record raw coverage for their shard instead of just
      # running it; the `coverage` job merges all four shards and enforces
      # the .c8rc.json thresholds. (The build above already ran, so the
      # runner is invoked directly instead of via `npm test`.)
      - run: npx c8 --reporter=none node scripts/run-tests.mjs --shard=${{ matrix.shard }}/4
        if: matrix.cell.coverage
      - name: Upload shard coverage
        if: matrix.cell.coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/tmp/
          if-no-files-found: error
      - run: node scripts/run-tests.mjs --shard=${{ matrix.shard }}/4
        if: ${{ !matrix.cell.coverage }}

  # The whole suite the way `npm test` runs it — every file in one `node --test`
  # invocation on one machine — because that is the profile publish.yml gates a
  # release on. Every other test job here shards (--shard=N/4, ~29 files per
  # runner), so without this job that profile is exercised nowhere in CI.
  #
  # This is not hypothetical. 0.8.29-beta failed at release because a test that
  # passes in every 29-file shard lost a race under the ~117-file load of the
  # single unsharded run, while CI was green on the very same commit. Since
  # ci.yml never runs on tags, that failure could only ever appear on the tag,
  # where it is the release's only gate and there is no retry.
  #
  # Deliberately not a matrix cell, and deliberately unsharded: sharding is the
  # thing that hides the failure. Invokes run-tests.mjs directly rather than
  # `npm test` so the build above is not repeated.
  unsharded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu + 22.x on purpose, matching publish.yml: the point is to
      # reproduce the release environment, not to widen coverage. Lint and
      # format are already covered once per cell by the test matrix.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs

  # Merges the raw per-shard coverage from the ubuntu + 22.x test cells and
  # enforces the .c8rc.json thresholds. Waits for every test shard, so a red
  # suite never produces a green coverage gate.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      # Needed for `"all": true` in .c8rc.json: uncovered files are
      # enumerated from dist/, so the report is computed against the same
      # tree the shards ran against.
      - run: npm run build

      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-shard-*
          path: coverage/tmp/
          merge-multiple: true

      # Merges coverage/tmp/*.json and exits non-zero if the .c8rc.json
      # thresholds aren't met.
      - run: npx c8 report --reporter=text --reporter=html
