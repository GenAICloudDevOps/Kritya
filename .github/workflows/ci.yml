name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static analysis of the JS/TS source for security vulnerabilities
  # (injection, unsafe regex, etc). Results land in the repo's Security tab,
  # not in job logs — a green check here means no new alerts, not zero
  # findings ever.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Needed for the analyze step to read workflow-run context on a
      # private repo (GET /repos/.../actions/runs/...) — without it, the
      # scan itself still completes but the job is reported as a
      # "configuration error" when it can't fetch that metadata.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  # Dependency checks that ask the registry, not the machine: the answer is the
  # same on every OS and Node version, so running them once per matrix entry
  # bought no extra coverage and made a registry-side hiccup look like five
  # separate failures. Here a failure is one clearly-labelled red job.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      # npm ci is itself the integrity check: it fails if any tarball doesn't
      # match the hash pinned in package-lock.json.
      - run: npm ci
      # `npm audit` behind a reviewed, expiring per-advisory allowlist — npm
      # can only suppress by severity, which would drop the gate for every
      # future high finding too. See scripts/audit-allowlist.json.
      - run: npm run check:audit
      - run: npm audit signatures
      - run: npm run check:install-scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both Node versions the package claims to support (`engines:
        # >=22`): 22.x is the floor, 24.x is the Active LTS most users
        # will actually be on once 22 drops to maintenance. Testing only
        # the floor meant the newer half of that range was never exercised.
        os: [ubuntu-latest]
        node-version: [22.x, 24.x]
        include:
          - os: windows-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # Kept per-OS rather than moved above: Windows checkouts can differ in
      # line endings, so this isn't purely a repeat of the Linux run.
      - run: npm run format:check
      # Coverage thresholds only need checking once; running c8 on every
      # OS/Node combination would just repeat the same numbers twice.
      # Pinned to one specific cell (ubuntu + 22.x) rather than "any ubuntu",
      # since ubuntu now runs on two Node versions.
      # These two conditions are complements — keep them in sync, or a matrix
      # change can silently leave coverage unenforced everywhere.
      - run: npm test
        if: matrix.os != 'ubuntu-latest' || matrix.node-version != '22.x'
      - run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
