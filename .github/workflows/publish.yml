name: Publish

# Fires only on a version tag (vX.Y.Z-beta), never on a plain commit to main
# — pushing the tag is the deliberate "release this" action, everything here
# is what happens automatically once you've made that call.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to mint the OIDC token npm's trusted publisher checks
    # No NPM_TOKEN anywhere in this workflow, on purpose — it stays fully
    # secretless. That means `latest` is NOT moved here: OIDC trusted
    # publishing only covers the `npm publish` call itself, not a follow-up
    # `npm dist-tag add`, and a stored token to cover that one extra command
    # isn't worth the long-lived-credential risk while still in beta. Point
    # latest at a release yourself, once you're ready:
    #   npm dist-tag add kritya@<version> latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          # No npm cache here on purpose (zizmor cache-poisoning): this job
          # publishes to the registry, so a poisoned cache would ship. v7
          # auto-enables caching via package-manager-cache (default true), so
          # it is disabled explicitly. Publish runs only on version tags, so
          # the slower uncached `npm ci` is negligible.
          package-manager-cache: false

      # Before anything expensive. A tag that disagrees with package.json, a
      # stale lock, or a missing/empty CHANGELOG section each produce a green
      # workflow with a wrong or blank result, so they are worth catching in
      # the first seconds rather than after the build and test run below.
      - run: npm run check:release

      - run: npm ci
      - run: npm run build
      - run: npm test

      # check:package and check:smoke are NOT run explicitly here. They live in
      # `prepublishOnly`, which `npm publish` invokes itself on the next step —
      # so they still gate this release, and they also gate a `npm publish`
      # someone runs by hand from a laptop, which an explicit step here could
      # never do. Listing them in both places would just run them twice.

      # OIDC trusted publishing needs npm >= 11.5.1; the version bundled with
      # Node 22 is older, so it's upgraded just for this job. Bounded to the
      # 11.x line rather than @latest: npm 12 already requires Node ^22.22.2,
      # so an unbounded upgrade would break this job on an older Node 22.x
      # runner. 11.5.1 is all trusted publishing needs.
      - run: npm install -g "npm@^11.5.1" # zizmor: ignore[adhoc-packages] npm itself has no lockfile; bounded to 11.x, not @latest, per the comment above

      # No token here on purpose: npm exchanges this job's OIDC identity
      # (registered as a trusted publisher on the kritya package) for a
      # short-lived publish credential itself. --provenance attaches the
      # signed build-to-source attestation using that same identity.
      #
      # This step also runs prepublishOnly → check:package + check:smoke, which
      # is why their output appears nested under it.
      - name: Publish to npm (beta)
        run: npm publish --provenance --tag beta

      # `npm publish` exiting 0 means the registry accepted the upload, not
      # that the version is readable back yet — propagation is not
      # instantaneous. Ask the registry directly so the run ends with a definite
      # answer, instead of leaving "the release exists but `npm view` still
      # shows the previous version" to be puzzled out from the outside.
      #
      # Two things are checked, because they propagate independently and the
      # dist-tag is the slower of the two: the version document, and the `beta`
      # dist-tag actually pointing at that version. "Version readable while the
      # tag still names the previous release" is a real, minutes-long state —
      # it is what made 0.8.34-beta look unpublished from the outside while
      # this job was green.
      #
      # It must not be able to *cost* the release, though. This step sits before
      # the release-creation steps, and a slow registry did exactly that on
      # 0.8.28-beta: the publish succeeded, the check timed out, and the GitHub
      # release was never created. Hence the raised budget below *and*
      # `continue-on-error` — the outcome is reported at the end of the job
      # instead of failing the run here. `steps.verify.outcome` still records
      # the true result even though the job stays green.
      - name: Verify the version and dist-tag are live on the registry
        id: verify
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p 'require("./package.json").name')"
          # The dist-tag the publish step above sets. Kept next to that step's
          # `--tag` so the two cannot silently disagree about which tag this
          # check is asserting.
          TAG=beta
          # 24 x 5s = 120s. 12 x 5s (60s) proved too tight: 0.8.27 got through
          # but 0.8.28 did not. Keep the budget in one place so the count, the
          # progress line, and the final message cannot drift apart.
          ATTEMPTS=24
          INTERVAL=5
          # Both conditions share one deadline: the version usually lands first,
          # so after it does the loop stops paying for that request and spends
          # the rest of the budget on the tag alone.
          version_ok=no
          tag_ok=no
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if [ "$version_ok" = no ]; then
              status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION" || true)"
              if [ "$status" = "200" ]; then version_ok=yes; fi
            fi
            if [ "$tag_ok" = no ]; then
              # Read the packument, NOT the `-/package/<name>/dist-tags`
              # convenience endpoint: that one is CDN-cached and served the
              # previous version for ~2 minutes after 0.8.34-beta had already
              # published, which is exactly the stale reading this step exists
              # to rule out. The packument carries the same field with no such
              # lag. The `?? ""` keeps a missing tag from printing "undefined",
              # and the `|| true` keeps a flaky request from failing the step
              # early instead of letting the loop retry.
              tag="$(curl -s "https://registry.npmjs.org/$NAME" | TAG="$TAG" node -e 'let d="";process.stdin.on("data",(c)=>{d+=c}).on("end",()=>{try{process.stdout.write(String((JSON.parse(d)["dist-tags"]||{})[process.env.TAG]??""))}catch{process.stdout.write("")}})' || true)"
              if [ "$tag" = "$VERSION" ]; then tag_ok=yes; fi
            fi
            if [ "$version_ok" = yes ] && [ "$tag_ok" = yes ]; then
              echo "$NAME@$VERSION is live on the registry and dist-tag '$TAG' points at it."
              exit 0
            fi
            echo "attempt $attempt/$ATTEMPTS: version visible=$version_ok, dist-tag $TAG=${tag:-unset} matches=$tag_ok; retrying in ${INTERVAL}s"
            sleep "$INTERVAL"
          done
          echo "::warning::$NAME@$VERSION: version visible=$version_ok, dist-tag $TAG matches=$tag_ok after $((ATTEMPTS * INTERVAL))s"
          exit 1

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --prerelease

      # Only reachable when the registry check above gave up. Deliberately last:
      # by this point the package is published *and* the GitHub release exists,
      # so this step can only ever add information — it cannot cost a release
      # the way failing inside the check itself did on 0.8.28-beta. Reads
      # `.outcome` rather than `.conclusion`, because continue-on-error is what
      # makes those two differ.
      - name: Warn if the registry check timed out
        if: steps.verify.outcome == 'failure'
        run: echo "::warning::${GITHUB_REF_NAME} was published and released, but the registry has not caught up — confirm the version with npm view kritya@${GITHUB_REF_NAME#v} version and the tag with npm view kritya dist-tags"
