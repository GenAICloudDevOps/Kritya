name: Publish

# Fires only on a version tag (vX.Y.Z-beta), never on a plain commit to main
# — pushing the tag is the deliberate "release this" action, everything here
# is what happens automatically once you've made that call.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to mint the OIDC token npm's trusted publisher checks
    # No NPM_TOKEN anywhere in this workflow, on purpose — it stays fully
    # secretless. That means `latest` is NOT moved here: OIDC trusted
    # publishing only covers the `npm publish` call itself, not a follow-up
    # `npm dist-tag add`, and a stored token to cover that one extra command
    # isn't worth the long-lived-credential risk while still in beta. Point
    # latest at a release yourself, once you're ready:
    #   npm dist-tag add kritya@<version> latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      # Before anything expensive. A tag that disagrees with package.json, a
      # stale lock, or a missing/empty CHANGELOG section each produce a green
      # workflow with a wrong or blank result, so they are worth catching in
      # the first seconds rather than after the build and test run below.
      - run: npm run check:release

      - run: npm ci
      - run: npm run build
      - run: npm test

      # check:package and check:smoke are NOT run explicitly here. They live in
      # `prepublishOnly`, which `npm publish` invokes itself on the next step —
      # so they still gate this release, and they also gate a `npm publish`
      # someone runs by hand from a laptop, which an explicit step here could
      # never do. Listing them in both places would just run them twice.

      # OIDC trusted publishing needs npm >= 11.5.1; the version bundled with
      # Node 22 is older, so it's upgraded just for this job. Bounded to the
      # 11.x line rather than @latest: npm 12 already requires Node ^22.22.2,
      # so an unbounded upgrade would break this job on an older Node 22.x
      # runner. 11.5.1 is all trusted publishing needs.
      - run: npm install -g "npm@^11.5.1"

      # No token here on purpose: npm exchanges this job's OIDC identity
      # (registered as a trusted publisher on the kritya package) for a
      # short-lived publish credential itself. --provenance attaches the
      # signed build-to-source attestation using that same identity.
      #
      # This step also runs prepublishOnly → check:package + check:smoke, which
      # is why their output appears nested under it.
      - name: Publish to npm (beta)
        run: npm publish --provenance --tag beta

      # `npm publish` exiting 0 means the registry accepted the upload, not
      # that the version is readable back yet — propagation is not
      # instantaneous. Ask the registry directly so the run ends with a definite
      # answer, instead of leaving "the release exists but `npm view` still
      # shows the previous version" to be puzzled out from the outside.
      #
      # It must not be able to *cost* the release, though. This step sits before
      # the release-creation steps, and a slow registry did exactly that on
      # 0.8.28-beta: the publish succeeded, the check timed out, and the GitHub
      # release was never created. Hence the raised budget below *and*
      # `continue-on-error` — the outcome is reported at the end of the job
      # instead of failing the run here. `steps.verify.outcome` still records
      # the true result even though the job stays green.
      - name: Verify the version is live on the registry
        id: verify
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p 'require("./package.json").name')"
          # 24 x 5s = 120s. 12 x 5s (60s) proved too tight: 0.8.27 got through
          # but 0.8.28 did not. Keep the budget in one place so the count, the
          # progress line, and the final message cannot drift apart.
          ATTEMPTS=24
          INTERVAL=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
            if [ "$status" = "200" ]; then
              echo "$NAME@$VERSION is live on the registry."
              exit 0
            fi
            echo "attempt $attempt/$ATTEMPTS: $NAME@$VERSION not visible yet (HTTP $status); retrying in ${INTERVAL}s"
            sleep "$INTERVAL"
          done
          echo "::warning::$NAME@$VERSION was accepted by npm publish but is still not visible on the registry after $((ATTEMPTS * INTERVAL))s"
          exit 1

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --prerelease

      # Only reachable when the registry check above gave up. Deliberately last:
      # by this point the package is published *and* the GitHub release exists,
      # so this step can only ever add information — it cannot cost a release
      # the way failing inside the check itself did on 0.8.28-beta. Reads
      # `.outcome` rather than `.conclusion`, because continue-on-error is what
      # makes those two differ.
      - name: Warn if the registry check timed out
        if: steps.verify.outcome == 'failure'
        run: echo "::warning::${GITHUB_REF_NAME} was published and released, but is not yet readable on the registry — confirm it with npm view kritya@${GITHUB_REF_NAME#v} version"
