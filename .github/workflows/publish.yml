name: Publish

# Fires only on a version tag (vX.Y.Z-beta), never on a plain commit to main
# — pushing the tag is the deliberate "release this" action, everything here
# is what happens automatically once you've made that call.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to mint the OIDC token npm's trusted publisher checks
    # No NPM_TOKEN anywhere in this workflow, on purpose — it stays fully
    # secretless. That means `latest` is NOT moved here: OIDC trusted
    # publishing only covers the `npm publish` call itself, not a follow-up
    # `npm dist-tag add`, and a stored token to cover that one extra command
    # isn't worth the long-lived-credential risk while still in beta. Point
    # latest at a release yourself, once you're ready:
    #   npm dist-tag add kritya@<version> latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # OIDC trusted publishing needs npm >= 11.5.1; the version bundled with
      # Node 22 is older, so it's upgraded just for this job.
      - run: npm install -g npm@latest

      # No token here on purpose: npm exchanges this job's OIDC identity
      # (registered as a trusted publisher on the kritya package) for a
      # short-lived publish credential itself. --provenance attaches the
      # signed build-to-source attestation using that same identity.
      - name: Publish to npm (beta)
        run: npm publish --provenance --tag beta

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --prerelease
