<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kritya</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <button id="new-conversation">+ New Conversation</button>
        <div id="session-list"></div>
      </div>
      <div id="main">
        <div id="workspace-bar">
          <span id="workspace-label">No workspace loaded</span>
          <span id="usage-label"></span>
          <span id="retry-label" class="hidden"></span>
          <button id="stop-button" class="hidden" type="button">Stop</button>
          <span id="kill-banner" class="hidden">
            ⛔ Kill switch active
            <button id="resume-button" type="button">Resume</button>
          </span>
        </div>
        <div id="task-list" class="hidden"></div>
        <div id="messages"></div>
        <div id="permission-prompt" class="hidden">
          <div id="permission-box">
            <p id="permission-text"></p>
            <pre id="permission-diff"></pre>
            <button id="permission-yes">Allow once</button>
            <button id="permission-always">Always allow</button>
            <button id="permission-no">Deny</button>
          </div>
        </div>
        <div id="picker-bar">
          <select id="provider-select"></select>
          <select id="model-select"></select>
          <label><input type="checkbox" id="plan-mode-toggle" /> Plan</label>
          <label><input type="checkbox" id="dry-run-toggle" /> Dry run</label>
          <label><input type="checkbox" id="accept-edits-toggle" /> Auto-accept edits</label>
        </div>
        <form id="input-form">
          <input id="prompt-input" placeholder="Ask kritya to do something..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
